// Bookloom: booking and enquiry API (portfolio sample by jdcreative.studiodesign)
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.2.0'
}

group = 'com.jdcreative'
version = '1.0.0'

repositories {
    mavenCentral()
}

configurations {
    mockitoAgent // Mockito is loaded as a Java agent at startup, as Mockito recommends for Java 21 and newer
}

dependencies {
    def boot = platform('org.springframework.boot:spring-boot-dependencies:4.2.0')
    implementation boot
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    testImplementation boot
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    mockitoAgent boot
    mockitoAgent('org.mockito:mockito-core') { transitive = false }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.compilerArgs += ['-parameters', '-Xlint:all']
}

tasks.named('test') {
    useJUnitPlatform()
    // -Xshare:off silences an informational JVM note caused by the Mockito agent.
    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}", '-Xshare:off'
    testLogging {
        events org.gradle.api.tasks.testing.logging.TestLogEvent.FAILED
        exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL
    }
}
